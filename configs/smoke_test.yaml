---
data:
  db_path: artifacts/experiment/smoke_test/smoke_test.db
  csv_path: data/our_twitter_sim/politics_30_good_bad_random_bernoulli.csv
simulation:
  num_timesteps: 2
  clock_factor: 60
  recsys_type: random

model:
  num_agents: 30
  model_random_seed: 42
  cfgs:
    - model_type: gpt-4o-mini
      model_path: openai
      num: 30
      server_url:
        - host: "openai"
          ports: [1]
      stop_tokens: []
      temperature: 0.7

inference:
  model_type: gpt-4o-mini
  model_path: openai
  server_url:
    - host: "openai"
      ports: [1]
  stop_tokens: []

actions:
  create_post:
    description: "Create a new post on your timeline."
    arguments:
      - name: "content"
        type: "string"
        description: "The text content of the post."
  quote_post:
    description: "Quote a specified post and add your own thoughts to it."
    arguments:
      - name: "post_id"
        type: "integer"
        description: "The ID of the post to be quoted."
      - name: "quote_content"
        type: "string"
        description: "Your own thoughts added to the quote."
  like_post:
    description: "Like a specific post."
    arguments:
      - name: "post_id"
        type: "integer"
        description: "The ID of the post to like."
  dislike_post:
    description: "Dislikes a specified post."
    arguments:
      - name: "post_id"
        type: "integer"
        description: "The ID of the post to dislike."
  repost:
    description: "Repost a post."
    arguments:
      - name: "post_id"
        type: "integer"
        description: "The ID of the post to repost."
  like_comment:
    description: "Like a specified comment."
    arguments:
      - name: "comment_id"
        type: "integer"
        description: "The ID of the comment to like."
  dislike_comment:
    description: "Dislike a specified comment."
    arguments:
      - name: "comment_id"
        type: "integer"
        description: "The ID of the comment to dislike."
  follow:
    description: "Follow a user."
    arguments:
      - name: "followee_id"
        type: "integer"
        description: "The ID of the user to be followed."
  mute:
    description: "Mute a user."
    arguments:
      - name: "mutee_id"
        type: "integer"
        description: "The ID of the user to mute."
  create_comment:
    description: "Comment on a post."
    arguments:
      - name: "post_id"
        type: "integer"
        description: "The ID of the post."
      - name: "content"
        type: "string"
        description: "The text of your comment."
      - name: "agree"
        type: "boolean"
        description: "Whether you agree with this post or not based on content."
      - name: "reasoning"
        type: "string"
        description: "Your Chain-of-Thought reasoning."
      - name: "emotion"
        type: "string"
        description: "The underlying emotion driving your comment."
